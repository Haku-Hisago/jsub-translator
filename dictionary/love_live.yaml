# Love Live! 系列专有名词
#
# 原则（任务 #11）：**不擅自汉化官方名称、不改变大小写**。
# 作品名、团体名、角色名一律保留官方写法，只把「说明性」的普通词译成中文。
#
# 这里只放已经确定写法的条目；没把握的宁可不写 —— 写错一个固定译名，
# 会让整片字幕都跟着错，比不写更糟。

terms:
  # ── 系列 / 企划 ──
  ラブライブ:
    zh: LoveLive!
  スクールアイドル:
    zh: 学园偶像
  スクールアイドルフェスティバル:
    zh: 学园偶像祭
  スクフェス:
    zh: 学园偶像祭

  # ── 常见设定词 ──
  部員:
    zh: 部员
  部長:
    zh: 部长
  副部長:
    zh: 副部长
  生徒会長:
    zh: 学生会会长
  廃校:
    zh: 废校
  存続:
    zh: 存续

groups:
  # 团体名一律保留官方写法
  μ's:
    zh: μ's
  Aqours:
    zh: Aqours
  Saint Snow:
    zh: Saint Snow
  虹ヶ咲学園スクールアイドル同好会:
    zh: 虹咲学园学园偶像同好会
  Liella!:
    zh: Liella!
  Sunny Passion:
    zh: Sunny Passion
  蓮ノ空女学院スクールアイドルクラブ:
    zh: 莲之空女学院学园偶像俱乐部
