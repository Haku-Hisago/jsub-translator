# 通用术语（跨题材都用得上）
#
# 结构说明：
#   terms:   一般术语 / 网络词
#   people:  人名 —— 固定译名，优先于模型自由翻译
#   groups:  团体名 / 作品名 —— 不擅自汉化，不改变大小写
#
# 也接受简写：`推し: 推`（值直接给字符串）。

terms:
  # ── 高频口语 ──
  やばい:
    zh: 厉害/糟了
  すごい:
    zh: 好厉害
  まじで:
    zh: 真的假的
  マジで:
    zh: 真的假的
  えー:
    zh: 诶
  うん:
    zh: 嗯
  はい:
    zh: 是/好
  なるほど:
    zh: 原来如此
  たしかに:
    zh: 确实
  しょうがない:
    zh: 没办法
  ありがとう:
    zh: 谢谢
  ごめん:
    zh: 抱歉
  おつかれ:
    zh: 辛苦了
  お疲れ様:
    zh: 辛苦了
  がんばって:
    zh: 加油
  楽しみ:
    zh: 期待
  嬉しい:
    zh: 开心
  寂しい:
    zh: 寂寞/舍不得
  恥ずかしい:
    zh: 害羞/不好意思

